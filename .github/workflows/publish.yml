name: Publish plugin catalog
on:
  push:
    branches: [main]
    paths: ['.packages/**/release.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plugin-catalog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish verified packages and update catalog
        run: node scripts/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}